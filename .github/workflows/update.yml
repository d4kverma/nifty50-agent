name: Update market data

on:
  schedule:
    # 10:05 UTC = 15:35 IST, weekdays — shortly after NSE close (15:30 IST)
    - cron: "5 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch quotes and compute analysis
        run: python scripts/fetch_and_analyze.py

      - name: Fetch fundamentals
        run: python scripts/fundamentals.py

      - name: Fetch news
        run: python scripts/news.py

      - name: Compute portfolio P&L
        run: python scripts/portfolio.py

      - name: Evaluate alert rules
        run: python scripts/alerts.py

      - name: Run backtest
        run: python scripts/backtest.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: update market data"
          git push
